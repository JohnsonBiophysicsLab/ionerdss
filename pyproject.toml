[build-system]
# 77 is the first setuptools that understands the PEP 639 license fields below
# (an SPDX string for `license`, plus `license-files`).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ioNERDSS"
version = "2.2.4"
description = "Package for preparing NERDSS inputs and analysing outputs."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Yue Moon Ying", email = "yying7@jh.edu"},
    { name = "Mankun Sang", email = "msang2@jhu.edu" },
    { name = "Samuel L Foley", email = "sfoley13@jh.edu"},
    { name = "Zixiu (Hugh) Liu", email = "zliu140@jhu.edu" },
    { name = "Sikao Guo", email = "sikaoguo@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["NERDSS Simulation", "Model Setup", "Analysis Tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy>=1.26.4, <3",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "PyOpenGL",
    "biopython",
    "scipy>=1.14, <2",
    "scikit-learn",
    "requests",
    "ipympl",
    "networkx"
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

# Pinned to the numpy 1.x / torch 2.2 stack. Install this into an environment of
# its own: its numpy==1.26.4 pin is incompatible with ovito_rendering, and pip
# resolves the conflict by silently installing an ancient OVITO that crashes
# when it renders.
proaffinity = [
  "numpy==1.26.4",
  "scipy==1.14.1",
  "torch==2.2.2",
  "torchvision==0.17.2",
  "torchaudio==2.2.2",
  "torch_geometric==2.3.0",
  "scikit-learn>=1.5.0",
  "transformers==4.38",
  "tokenizers==0.15.2",
  "huggingface-hub>=0.33.2",
  "safetensors>=0.5.3",
  "accelerate>=0.26",
]

# OVITO's OpenGL renderer only draws offscreen from 3.16 onwards; below that,
# Viewport.render_image() fails on a headless machine and aborts the process
# rather than raising, so ionerdss renders through the software ray tracers
# instead (see _ovito_render_worker.candidate_renderers).
#
# The floor stays at 3.15 all the same. ovito 3.16.0 pins PySide6~=6.10.3, and
# PySide6 6.10 ships manylinux_2_34 wheels for Linux x86_64, so on a glibc 2.28
# cluster (RHEL/Rocky 8 -- Rockfish among them) there is no PySide6 pip can
# install and the whole install dies with "No matching distribution found for
# PySide6". Asking for >=3.15 lets pip take 3.16 wherever its dependencies
# resolve and back off to 3.15.5 + PySide6 6.9.3 where they do not.
ovito_rendering = ["ovito>=3.15", "imageio", "Pillow"]

jupyter = ["jupyter", "jupyterlab", "ipykernel", "ipywidgets"]

simularium = [
    "simulariumio",
    "MDAnalysis",    # for simulariumio reading NERDSS PDB files
    # simulariumio 1.13.0 (latest on PyPI) writes in place into an array that
    # pandas 3.0+ returns read-only, so its NERDSS converter raises
    # "ValueError: assignment destination is read-only". The fix is on
    # simulariumio's GitHub main branch but is not yet released to PyPI.
    "pandas<3"
]

docs = [
    "mkdocs>=1.6",
]

# Everything that can coexist in one environment. proaffinity is deliberately
# excluded: its numpy==1.26.4 pin conflicts with current OVITO's numpy>=2
# requirement. Install it separately with: pip install "ioNERDSS[proaffinity]"
# The ovito floor is 3.15 for the reason spelled out above ovito_rendering.
all = [
    "pytest",
    "pytest-cov",
    "ovito>=3.15",
    "imageio",
    "Pillow",
    "jupyter",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "mkdocs>=1.6",
]

[tool.setuptools]
include-package-data = true

# Only ionerdss is installed. In pyproject.toml, packages.find defaults to
# namespaces = true, under which every directory counts as a PEP 420 package
# whether or not it has an __init__.py. Without `include`, that swept benchmark/
# and developer_tests/ into the wheel as top-level packages of their own, so
# `pip install ioNERDSS` dropped site-packages/benchmark and
# site-packages/developer_tests -- generic names another project could collide
# with. (data/, docs/, website/ and the rest were discovered too, and stayed out
# of the wheel only because they hold no .py files.)
#
# Do not "tidy" this by adding namespaces = false, the setting the setuptools
# docs pair with `include`. A dozen subpackages have no __init__.py --
# ionerdss.model.components, all of ionerdss.model.graph_based, ionerdss.tests
# among them -- and would silently vanish from the wheel.
[tool.setuptools.packages.find]
where = ["."]
include = ["ionerdss*"]

[tool.pytest.ini_options]
# Both test trees. ionerdss/tests had been collected by nobody: CI passed
# `pytest developer_tests` explicitly, which overrides testpaths, and testpaths
# named only the one directory anyway. The workflow now runs a bare `pytest` so
# this list is the single place that decides what gets run.
testpaths = ["developer_tests", "ionerdss/tests"]

[tool.coverage.run]
# ionerdss/tests sits inside the package that --cov measures, so without this its
# own files are counted as covered and lift the reported figure by several points
# for nothing. Measure the library, not the tests exercising it.
omit = ["ionerdss/tests/*"]

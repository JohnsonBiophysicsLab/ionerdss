[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ioNERDSS"
version = "2.2.3"
description = "Package for preparing NERDSS inputs and analysing outputs."
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [
    { name = "Yue Moon Ying", email = "yying7@jh.edu"},
    { name = "Mankun Sang", email = "msang2@jhu.edu" },
    { name = "Samuel L Foley", email = "sfoley13@jh.edu"},
    { name = "Zixiu (Hugh) Liu", email = "zliu140@jhu.edu" },
    { name = "Sikao Guo", email = "sikaoguo@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["NERDSS Simulation", "Model Setup", "Analysis Tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy>=1.26.4, <3",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "PyOpenGL",
    "biopython",
    "scipy>=1.14, <2",
    "scikit-learn",
    "requests",
    "ipympl",
    "networkx"
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

# Pinned to the numpy 1.x / torch 2.2 stack. Install this into an environment of
# its own: its numpy==1.26.4 pin is incompatible with ovito_rendering, and pip
# resolves the conflict by silently installing an ancient OVITO that crashes
# when it renders.
proaffinity = [
  "numpy==1.26.4",
  "scipy==1.14.1",
  "torch==2.2.2",
  "torchvision==0.17.2",
  "torchaudio==2.2.2",
  "torch_geometric==2.3.0",
  "scikit-learn>=1.5.0",
  "transformers==4.38",
  "tokenizers==0.15.2",
  "huggingface-hub>=0.33.2",
  "safetensors>=0.5.3",
  "accelerate>=0.26",
]

# OVITO below 3.16 cannot create an offscreen framebuffer when the module is
# imported into an external interpreter, so Viewport.render_image() fails -- and
# on headless machines it aborts the process rather than raising. 3.16 renders
# offscreen out of the box. Note that ovito>=3.16 requires numpy>=2, which is
# why it cannot share an environment with the proaffinity extra below.
ovito_rendering = ["ovito>=3.16", "imageio", "Pillow"]

jupyter = ["jupyter", "jupyterlab", "ipykernel", "ipywidgets"]

simularium = [
    "simulariumio",
    "MDAnalysis",    # for simulariumio reading NERDSS PDB files
    # simulariumio 1.13.0 (latest on PyPI) writes in place into an array that
    # pandas 3.0+ returns read-only, so its NERDSS converter raises
    # "ValueError: assignment destination is read-only". The fix is on
    # simulariumio's GitHub main branch but is not yet released to PyPI.
    "pandas<3"
]

docs = [
    "mkdocs>=1.6",
]

# Everything that can coexist in one environment. proaffinity is deliberately
# excluded: its numpy==1.26.4 pin conflicts with ovito's numpy>=2 requirement.
# Install it separately with: pip install "ioNERDSS[proaffinity]"
all = [
    "pytest",
    "pytest-cov",
    "ovito>=3.16",
    "imageio",
    "Pillow",
    "jupyter",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "mkdocs>=1.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["developer_tests"]

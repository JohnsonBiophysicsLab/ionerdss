[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ioNERDSS"
version = "1.2.0"
description = "Package for preparing NERDSS inputs and analysing outputs."
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [
    { name = "Zixiu (Hugh) Liu", email = "zliu140@jhu.edu" },
    { name = "Sikao Guo", email = "sikaoguo@gmail.com" },
    { name = "Mankun Sang", email = "msang2@jhu.edu" }
]
requires-python = ">=3.9"
keywords = ["NERDSS Simulation", "Model Setup", "Analysis Tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "PyQt6",
    "pyqtgraph",
    "PyOpenGL",
    "biopython",
    "scipy",
    "scikit-learn",
    "requests",
    "ipympl"
]

[project.optional-dependencies]
# Dependencies for running the test suite
test = ["pytest", "pytest-cov"]

# Dependencies for the ODE/Gillespie solver functionality
ode = ["networkx"]

# Dependencies for advanced rendering with Ovito
ovito_rendering = ["ovito", "imageio", "Pillow"]

# Dependencies for local development (Jupyter, etc.)
dev = ["jupyter", "jupyterlab", "ipykernel", "ipywidgets"]

# A combined group to install all optional dependencies at once
full = ["ioNERDSS[test,ode,ovito_rendering,dev]"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

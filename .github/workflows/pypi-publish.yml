# Builds and uploads the package to PyPI when a GitHub release is published.
# Reference: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # Step 3: Upgrade pip and install build tools
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    # Step 4: Fail early if the release tag and pyproject version disagree,
    # otherwise PyPI rejects the upload with an opaque "400 Bad Request"
    # because that version was already published.
    - name: Check tag matches project version
      run: |
        tag="${GITHUB_REF_NAME#v}"
        project="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
        echo "tag=$tag project=$project"
        if [ "$tag" != "$project" ]; then
          echo "::error::Release tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$project'. Bump the version before releasing."
          exit 1
        fi

    # Step 5: Build the package
    - name: Build package
      run: python -m build

    # Step 6: Validate the built metadata
    - name: Check distributions
      run: twine check dist/*

    # Step 7: Publish to PyPI
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

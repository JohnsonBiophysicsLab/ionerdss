# Conda environment for developing ionerdss
# This file installs conda-based dependencies and then uses pip
# to install the local ionerdss package in editable mode.
name: ionerdss-dev
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pyqt6
  - pip:
      # Install the local package in editable mode with typical dev dependencies
      # This reads dependencies from pyproject.toml
      - -e .[test,jupyter]
